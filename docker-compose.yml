services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insighthub}
      POSTGRES_USER: ${POSTGRES_USER:-insighthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insighthub_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insighthub} -d ${POSTGRES_DB:-insighthub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai_service:
    build:
      context: ./ai_service
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-change-this-internal-service-secret}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-docker-secret-key-replace-in-production-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-insighthub}:${POSTGRES_PASSWORD:-insighthub_pass}@postgres:5432/${POSTGRES_DB:-insighthub}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_ENABLED: ${CELERY_ENABLED:-True}
      AI_SERVICE_URL: http://ai_service:8001
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-change-this-internal-service-secret}
      AUTO_SEED_DEMO: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-InsightDemo!2026}
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
    command: celery -A insighthub worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-docker-secret-key-replace-in-production-2026}
      DATABASE_URL: postgresql://${POSTGRES_USER:-insighthub}:${POSTGRES_PASSWORD:-insighthub_pass}@postgres:5432/${POSTGRES_DB:-insighthub}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_ENABLED: "True"
      AI_SERVICE_URL: http://ai_service:8001
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-change-this-internal-service-secret}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
