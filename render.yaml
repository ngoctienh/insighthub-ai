databases:
  - name: insighthub-db
    plan: free
    databaseName: insighthub
    user: insighthub

services:
  - type: web
    name: insighthub-ai-service
    runtime: python
    plan: free
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: auto
      - key: AI_SERVICE_API_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: insighthub-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo_data && gunicorn insighthub.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: insighthub-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: insighthub-ai-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_API_KEY
        fromService:
          type: web
          name: insighthub-ai-service
          envVarKey: AI_SERVICE_API_KEY
      - key: CELERY_ENABLED
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false

  - type: web
    name: insighthub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
