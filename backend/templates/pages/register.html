{% extends "base.html" %}
{% block title %}Đăng ký — InsightHub AI{% endblock %}

{% block body %}
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
    <div class="flex items-center gap-2.5 mb-6">
      <a href="{% url 'web-landing' %}" class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </a>
      <div>
        <h1 class="text-xl font-bold text-slate-900">Đăng ký tài khoản Khách hàng</h1>
        <p class="text-xs text-slate-500">Gửi phản hồi và theo dõi tiến độ xử lý trên Roadmap</p>
      </div>
    </div>

    {% if error %}
      <div class="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-sm">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="{% url 'web-register' %}" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Họ và tên</label>
        <input
          type="text"
          name="full_name"
          required
          value="{{ form.full_name|default:'' }}"
          placeholder="Nguyễn Văn A"
          class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:border-brand-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Tên đăng nhập</label>
        <input
          type="text"
          name="username"
          required
          value="{{ form.username|default:'' }}"
          placeholder="nguyenvana"
          class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:border-brand-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input
          type="email"
          name="email"
          required
          value="{{ form.email|default:'' }}"
          placeholder="vana@gmail.com"
          class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:border-brand-500 outline-none"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu (tối thiểu 8 ký tự)</label>
        <input
          type="password"
          name="password"
          required
          minlength="8"
          placeholder="••••••••"
          class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:border-brand-500 outline-none"
        />
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700">
        Đăng ký
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      Đã có tài khoản?
      <a href="{% url 'web-login' %}" class="font-semibold text-brand-600 hover:underline">
        Đăng nhập
      </a>
    </p>
  </div>
</div>
{% endblock %}
