{% extends "base.html" %}
{% block title %}Không có quyền truy cập — InsightHub AI{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 p-8 shadow-sm text-center space-y-4">
    <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto">
      <i data-lucide="shield-alert" class="w-6 h-6"></i>
    </div>
    <h1 class="text-xl font-bold text-slate-900">403 — Không có quyền truy cập</h1>
    <p class="text-sm text-slate-600">{{ error_message }}</p>
    <a href="{{ home_url }}" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700">
      Quay về trang chính
    </a>
  </div>
</div>
{% endblock %}
